<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Профиль — Sharing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        .nav {
            margin-bottom: 24px;
        }
        .nav a {
            margin-right: 16px;
            text-decoration: none;
            color: #1976d2;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        .profile-info {
            margin-bottom: 24px;
        }
        .profile-info p {
            margin: 8px 0;
            font-size: 16px;
        }
        .profile-info label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 120px;
        }
        .quota-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #ddd;
        }
        .quota-section h2 {
            margin-top: 0;
            color: #333;
        }
        .quota-bar-container {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin: 12px 0;
        }
        .quota-bar {
            height: 100%;
            background: #4caf50;
            border-radius: 12px;
            transition: width 0.3s ease;
        }
        .quota-bar.warning {
            background: #ff9800;
        }
        .quota-bar.danger {
            background: #f44336;
        }
        .quota-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .role-admin {
            background: #ffebee;
            color: #c62828;
        }
        .role-user {
            background: #e3f2fd;
            color: #1565c0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/home}">Главная</a>
        <a th:href="@{/files}">Мои файлы</a>
        <a th:href="@{/links}">Мои ссылки</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/custom/users/view/list}">Панель администратора</a>
        <a th:href="@{/logout}">Выйти</a>
    </div>

    <h1>Профиль</h1>

    <div class="profile-info">
        <p><label>Email:</label> <span th:text="${user.email}">user@example.com</span></p>
        <p><label>Имя:</label> <span th:text="${user.fullName} ?: '—'">Имя</span></p>
        <p><label>Роль:</label>
            <span class="role-badge"
                  th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : 'role-user'"
                  th:text="${user.role}">USER</span>
        </p>
    </div>

    <div class="quota-section">
        <h2>Квота хранилища</h2>

        <div th:if="${quota != null}">
            <div class="quota-bar-container">
                <div class="quota-bar"
                     th:style="'width:' + ${usedPercent} + '%'"
                     th:classappend="${usedPercent >= 90} ? 'danger' : (${usedPercent >= 70} ? 'warning' : '')"></div>
            </div>
            <div class="quota-text">
                <span th:text="${#numbers.formatDecimal(quota.usedBytes / 1048576.0, 1, 2)} + ' MB использовано'">0 MB использовано</span>
                <span th:text="${#numbers.formatDecimal(quota.maxBytes / 1048576.0, 1, 2)} + ' MB всего'">1024 MB всего</span>
            </div>
            <p style="margin-top: 8px; font-size: 14px; color: #777;"
               th:text="'(' + ${usedPercent} + '%)'">(0%)</p>
        </div>

        <div th:if="${quota == null}">
            <p style="color: #888; font-style: italic;">Квота не настроена</p>
        </div>
    </div>
</div>
</body>
</html>
