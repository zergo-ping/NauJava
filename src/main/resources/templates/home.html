<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Sharing — Главная</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        margin-top: 0;
        color: #333;
      }
      .nav {
        margin-top: 24px;
      }
      .nav a {
        display: inline-block;
        margin: 8px;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 4px;
      }
      .btn-primary {
        background: #1976d2;
        color: #fff;
      }
      .btn-secondary {
        background: #e0e0e0;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 th:text="${@environment.getProperty('app.name')}">Sharing</h1>
      <p>Веб-приложение для хранения и совместного доступа к файлам</p>

      <div class="nav" sec:authorize="!isAuthenticated()">
        <a th:href="@{/auth/login}" class="btn btn-primary">Вход</a>
        <a th:href="@{/auth/register}" class="btn btn-secondary">Регистрация</a>
      </div>

      <div class="nav" sec:authorize="isAuthenticated()">
        <a th:href="@{/files}" class="btn btn-primary">Мои файлы</a>
        <a th:href="@{/links}" class="btn btn-primary">Мои ссылки</a>
        <a th:href="@{/account/profile}" class="btn btn-primary">Профиль</a>
        <a
          sec:authorize="hasRole('ADMIN')"
          th:href="@{/custom/users/view/list}"
          class="btn btn-secondary"
          >Панель администратора</a
        >
        <a th:href="@{/logout}" class="btn btn-secondary">Выйти</a>
      </div>
    </div>
  </body>
</html>
