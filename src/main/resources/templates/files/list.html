<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Мои файлы — Sharing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
      }
      .nav {
        margin-bottom: 20px;
      }
      .nav a {
        margin-right: 16px;
        text-decoration: none;
        color: #1976d2;
      }
      .nav a:hover {
        text-decoration: underline;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #f0f0f0;
      }
      .actions form {
        display: inline;
      }
      .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
      }
      .btn-download {
        background: #1976d2;
        color: #fff;
      }
      .btn-delete {
        background: #d32f2f;
        color: #fff;
      }
      .btn-upload {
        background: #388e3c;
        color: #fff;
        display: inline-block;
        margin-bottom: 16px;
      }
      .btn-create {
        background: #1976d2;
        color: #fff;
      }
      .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 16px;
      }
      .alert-success {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .alert-error {
        background: #ffebee;
        color: #c62828;
      }
      .empty {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/home}">Главная</a>
        <a th:href="@{/files}">Мои файлы</a>
        <a th:href="@{/links}">Мои ссылки</a>
        <a th:href="@{/account/profile}">Профиль</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/custom/users/view/list}"
          >Панель администратора</a
        >
        <a th:href="@{/logout}">Выйти</a>
      </div>

      <h1>Мои файлы</h1>

      <div
        th:if="${success}"
        class="alert alert-success"
        th:text="${success}"
      ></div>
      <div th:if="${linkToken}" class="alert alert-success">
        Публичная ссылка на файл:
        <code th:text="${baseUrl} + '/links/' + ${linkToken}">http://localhost:8080/links/token</code>
      </div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <a th:href="@{/files/upload}" class="btn btn-upload">+ Загрузить файл</a>

      <table th:if="${!files.isEmpty()}">
        <thead>
          <tr>
            <th>Имя</th>
            <th>Размер</th>
            <th>Дата загрузки</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="file : ${files}">
            <td th:text="${file.fileName}">file.txt</td>
            <td
              th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'"
            >
              1.00 KB
            </td>
            <td
              th:text="${#temporals.format(file.uploadedAt, 'dd.MM.yyyy HH:mm')}"
            >
              01.01.2024
            </td>
            <td class="actions">
              <a
                th:href="@{/files/download/{id}(id=${file.id})}"
                class="btn btn-download"
                >Скачать</a
              >
              <form
                th:action="@{/files/delete/{id}(id=${file.id})}"
                method="post"
                style="display: inline; margin-left: 8px"
              >
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button
                  type="submit"
                  class="btn btn-delete"
                  onclick="return confirm('Удалить файл?');"
                >
                  Удалить
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <p th:if="${files.isEmpty()}" class="empty">
        Файлов пока нет. Загрузите первый файл!
      </p>
    </div>
  </body>
</html>
