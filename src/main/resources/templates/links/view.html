<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Общий доступ к файлу — Sharing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        margin-top: 0;
      }
      .file-name {
        font-size: 18px;
        font-weight: bold;
        margin: 16px 0;
        word-break: break-all;
      }
      .info {
        color: #666;
        margin-bottom: 24px;
      }
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
        display: inline-block;
      }
      .btn-download {
        background: #1976d2;
        color: #fff;
      }
      .btn-download:hover {
        background: #1565c0;
      }
      .alert-error {
        background: #ffebee;
        color: #c62828;
        padding: 16px;
        border-radius: 4px;
        margin-bottom: 16px;
      }
      .expired {
        color: #c62828;
        font-weight: bold;
      }
      .token {
        font-family: monospace;
        background: #f5f5f5;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div th:if="${error}" class="alert-error" th:text="${error}"></div>

      <div th:unless="${error}">
        <h1>Общий доступ к файлу</h1>

        <div th:if="${file}" class="file-name" th:text="${file.fileName}">
          file.txt
        </div>

        <div class="info">
          <p th:if="${link.expiresAt != null}">
            Ссылка действует до:
            <span
              th:text="${#temporals.format(link.expiresAt, 'dd.MM.yyyy HH:mm')}"
            ></span>
          </p>
          <p th:if="${link.maxDownloads != null}">
            Осталось скачиваний:
            <span
              th:text="${link.maxDownloads - link.currentDownloads} + ' из ' + ${link.maxDownloads}"
            ></span>
          </p>
          <p>
            Создана:
            <span
              th:text="${#temporals.format(link.createdAt, 'dd.MM.yyyy HH:mm')}"
            ></span>
          </p>
        </div>

        <div th:if="${valid}">
          <a
            th:if="${file}"
            th:href="@{/links/{token}/download(token=${link.token})}"
            class="btn btn-download"
            >Скачать файл</a
          >
        </div>

        <div th:unless="${valid}" class="expired">
          <p>Ссылка недействительна или срок её действия истёк.</p>
        </div>
      </div>
    </div>
  </body>
</html>
